<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML FORM</title>
</head>
<body>
    <h2>Create Form in HTML</h2>
    <h3> Student Registration Form</h3>
    <Form>
        <label>Full Name</label><br>
        <input type="text" name="name" placeholder="Full name" required maxlength="50"><br>
        <label>Email</label><br>
        <input type="email" placeholder="Your E-mail"required maxlength="50"><br>
        <label>pasword</label><br>
        <input type="pasword" placeholder="Your pasword"required maxlength="50"><br>
        <label>Date of Birth</label><br>
        <input type="date" name="date" required><br>
        <label>class</label><br>
        <select>
            <option>X-1</option>
            <option>X-2</option>
            <option>X-3</option>
        </select><br>
        <label>Gender</label><br>
        <input type="radio" name="gender">Male
        <input type="radio" name="gender">Female <br>
        <label>Skilss</label>
        <input type="checkbox" name="skilss">HTML
        <input type="checkbox" name="skilss">CSS
        <input type="checkbox" name="Skilss">javascripts<br>
        <label>About yourself</label><br>
        <textarea rows="5" cols="40" placeholder="Descripe about yourself here...."></textarea><br>
        <button type="submit">submit</button>
        <button type="reset">Reset</button>
        
    </Form>
</body>
</html>
