<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>school schedule</title>
</head>
<body>
    <h2>class X ICT Weekly Schedule</h2>
    <table border="1">
        <!--TABLE HEADER-->
        <thead>
            <tr>
                <th rowspan="2">Day</th>
                <th rowspan="2">Time</th>
                <th colspan="3">Subject</th>
            </tr>
            <tr>
                <th>Monday</th>
                <th>Tuesday</th>
                <th>Wednesday</th>
            </tr>
        </thead>
        <!--TABLE BODY-->
        <tbody>
            <tr>
                <td rowspan="2">Morning</td>
                <td>7:00 - 8:30</td>
                <td>HTML Fundamentals</td>
                <td>CSS Basics</td>
                <td>JavaScript Introduction</td>
            </tr>
            <tr>
                <td>Afternoon</td>
                <td>13:00 - 14:30</td>
                <td colspan="3">Web Development Project</td>
            </tr>
        </tbody>
        <!--TABLE FOOTER-->
        <tfoot>
            <tr>
                <td colspan="5">ICT Program - SMA AL-Abidin Bilingual Boarding School</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
