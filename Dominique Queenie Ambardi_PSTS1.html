<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Creatyfity,Skills and Inofatif Ideas</title>
     <!-- Tailwind CSS play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body{
            font-family: 'inter', sans-serif;
        }
    </style>
</head>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-6"></body>
<body class="bg-slate-100 min-h-screen py-8 px-4 sm:px-6 lg:px-8 flex flex-col justify-between">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-6">

    <!--Container Utama-->
<div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl p-6 sm:p-8 border border-slate-200">
    <!-- Header -->
    <div class="mb-6 border-b pb-4">
      <h1 class="text-2xl font-bold text-slate-800">Student Creatyfity Festival</h1>
      <p class="text-slate-500 text-sm mt-1">Showcase Your Creatyfity Skills and Inovation Ideas</p>
    </div>

    <!-- 1.Student Name -->
      <div>
        <label for="name" class="block text-sm font-semibold text-slate-700 mb-1">Student Name</label>
        <input type="text" id="name" name="name" required placeholder="Enter your full name" 
          class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
      </div>

      <!-- 2. Class -->
       <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Class</label>
        <div class="flex flex-wrap gap-4 text-sm text-slate-700">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="radio" name="class" value="X" required class="accent-blue-600"> X
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="radio" name="class" value="XI" class="accent-blue-600"> XI
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="radio" name="class" value="XII" class="accent-blue-600"> XII
          </label>
        </div>
      </div>

    <!-- 3. Gender -->
     <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Gender</label>
        <div class="flex flex-wrap gap-4 text-sm text-slate-700">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="radio" name="gender" value="male" required class="accent-blue-600"> Male
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="radio" name="gender" value="Female" class="accent-blue-600"> Female
          </label>
        </div>
      </div>

      <!-- Competition Category-->
      <div>
        <label for="lab" class="block text-sm font-semibold text-slate-700 mb-1">Competition Category</label>
        <select id="lab" name="lab" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition bg-white">
          <option value="" disabled selected>Select a Compatition Category</option>
          <option value="Web Development">Web Development</option>
          <option value="IoT Project">IoT Project</option>
          <option value="Graphic Design">Graphic Design</option>
        </select>
      </div>
</div>    
    
</body>
</html>
